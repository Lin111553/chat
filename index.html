<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ededed">
  <title>小聚 · 聊天</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#ededed;font-synthesis:none}*{box-sizing:border-box}body{margin:0;height:100vh;min-height:560px;display:grid;place-items:center;background:#ededed}.window{width:min(1120px,100vw);height:min(760px,100vh);min-height:560px;background:#fff;display:grid;grid-template-columns:66px 300px minmax(0,1fr);overflow:hidden;box-shadow:0 10px 40px #00000014}.rail{background:#202a33;color:#aab3ba;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:23px}.userpic,.avatar{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:#b8d8c0;color:#315c40;font-size:16px;font-weight:650;flex:none}.railbtn{width:42px;height:42px;border:0;background:transparent;color:#9da8af;border-radius:8px;font-size:21px;cursor:pointer}.railbtn.active,.railbtn:hover{color:#07c160}.railbottom{margin-top:auto}.listpane{background:#f7f7f7;border-right:1px solid #e7e7e7;display:flex;flex-direction:column;min-width:0}.listhead{height:65px;padding:0 16px;display:flex;align-items:center;gap:10px}.search{height:34px;background:#eaeaea;border:0;border-radius:5px;padding:0 10px;outline:none;flex:1;min-width:0;font-size:13px}.add{border:0;background:#eaeaea;border-radius:5px;width:34px;height:34px;font-size:20px;color:#444;cursor:pointer}.tabs{height:40px;display:flex;align-items:center;padding:0 15px;gap:20px;border-bottom:1px solid #eee;color:#999;font-size:13px}.tab{height:40px;display:flex;align-items:center;cursor:pointer}.tab.active{color:#07a954;border-bottom:2px solid #07c160}.conversation-list{overflow:auto;flex:1}.conversation{height:72px;display:flex;align-items:center;gap:11px;padding:0 13px;cursor:pointer}.conversation:hover{background:#eee}.conversation.selected{background:#e6e6e6}.avatar{width:45px;height:45px;font-size:17px;border-radius:5px;background:#d6e8f4;color:#47718c}.conversation:nth-child(3n) .avatar{background:#f1ddce;color:#906442}.conversation:nth-child(4n) .avatar{background:#e5def5;color:#695c91}.convtext{min-width:0;flex:1}.convtop{display:flex;align-items:center;justify-content:space-between;gap:6px}.convname{font-size:14px;color:#222}.convtime{font-size:10px;color:#aaa;white-space:nowrap}.preview{font-size:12px;color:#999;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatpane{display:flex;flex-direction:column;min-width:0;background:#f5f5f5}.chathead{height:61px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#f5f5f5;border-bottom:1px solid #e7e7e7}.chatname{font-size:16px}.headactions{display:flex;gap:18px;color:#777;font-size:19px}.headactions button{border:0;background:none;color:inherit;cursor:pointer}.messagearea{flex:1;overflow:auto;padding:22px 7%;display:flex;flex-direction:column;gap:18px}.dayline{text-align:center;color:#bbb;font-size:11px;margin:0 0 6px}.message{display:flex;align-items:flex-start;gap:10px;max-width:78%}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message .avatar{width:36px;height:36px}.bubblebox{min-width:0}.bubble{background:#fff;border-radius:3px;padding:10px 12px;font-size:14px;line-height:1.55;overflow-wrap:anywhere;box-shadow:0 1px 1px #00000008}.mine .bubble{background:#95ec69}.msgtime{font-size:10px;color:#bbb;margin-top:5px}.mine .msgtime{text-align:right}.composer{height:180px;background:#f5f5f5;border-top:1px solid #e7e7e7;padding:12px 22px 14px;display:flex;flex-direction:column}.tools{display:flex;gap:17px;color:#777;font-size:18px;margin-bottom:8px}.tools button{border:0;background:none;color:inherit;cursor:pointer;padding:0}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:14px inherit;line-height:1.6}.composerfoot{display:flex;justify-content:space-between;align-items:center;color:#aaa;font-size:11px}.send{border:0;background:#07c160;color:white;padding:8px 25px;border-radius:4px;cursor:pointer;font-size:13px}.send:hover{background:#06ad56}.empty{text-align:center;color:#aaa;margin:auto;font-size:14px;line-height:2}.notice{font-size:10px;color:#aaa;text-align:center;padding:0 10px 8px}.mobileback{display:none}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.dialog{width:min(380px,100%);background:#fff;padding:27px;border-radius:8px;box-shadow:0 15px 50px #0003}.dialog h1{font-size:20px;margin:0 0 8px}.dialog p{font-size:13px;color:#777;line-height:1.65}.dialog label{font-size:12px;display:block;margin:14px 0 6px}.dialog input{width:100%;border:1px solid #ddd;border-radius:4px;padding:11px;outline:none}.dialog .send{width:100%;padding:11px;margin-top:18px}.warning{font-size:11px!important;color:#956c2f!important;background:#fff7e5;padding:10px;border-radius:4px}.error{font-size:12px;color:#c44;min-height:16px;margin-top:8px}.hidden{display:none!important}
    @media(max-width:700px){body{min-height:0}.window{height:100dvh;min-height:0;grid-template-columns:1fr;position:relative}.rail{display:none}.listpane{grid-column:1;grid-row:1}.chatpane{display:none;grid-column:1;grid-row:1}.window.chat-open .listpane{display:none}.window.chat-open .chatpane{display:flex}.chathead{padding:0 14px;height:56px}.mobileback{display:inline-block!important;border:0;background:none;font-size:20px;margin-right:12px;color:#555}.messagearea{padding:18px 14px}.composer{height:165px;padding:10px 13px}.message{max-width:90%}.listhead{height:60px}.notice{font-size:9px}}
  </style>
</head>
<body>
  <div class="window" id="window">
    <nav class="rail" aria-label="主导航">
      <div class="userpic" id="railAvatar">我</div>
      <button class="railbtn active" title="聊天" aria-label="聊天">▣</button>
      <button class="railbtn" title="通讯录" aria-label="通讯录">♙</button>
      <button class="railbtn" title="收藏" aria-label="收藏">☆</button>
      <button class="railbtn railbottom" title="设置" aria-label="设置">⚙</button>
    </nav>
    <aside class="listpane">
      <div class="listhead"><input class="search" id="search" placeholder="⌕　搜索" aria-label="搜索聊天"><button class="add" id="newChat" title="新聊天">＋</button></div>
      <div class="tabs"><div class="tab active" data-tab="chats">聊天</div><div class="tab" data-tab="contacts">联系人</div></div>
      <div class="conversation-list" id="conversationList"></div>
      <div class="notice">小聚网页演示 · 暂不支持跨设备或多人实时同步</div>
    </aside>
    <main class="chatpane">
      <header class="chathead"><div style="display:flex;align-items:center"><button class="mobileback" id="back" aria-label="返回">‹</button><div class="chatname" id="activeName">文件传输助手</div></div><div class="headactions"><button title="语音通话" aria-label="语音通话">☎</button><button title="更多" aria-label="更多">⋯</button></div></header>
      <section class="messagearea" id="messageArea" aria-live="polite"></section>
      <form class="composer" id="composeForm"><div class="tools"><button type="button" title="表情">☻</button><button type="button" title="图片">▧</button><button type="button" title="文件">▤</button><button type="button" title="截图">▣</button></div><textarea id="messageText" placeholder="输入消息，按 Enter 发送（Shift + Enter 换行）" aria-label="输入消息"></textarea><div class="composerfoot"><span>仅本机演示数据</span><button class="send" type="submit">发送</button></div></form>
    </main>
  </div>
  <div class="overlay" id="gate"><form class="dialog" id="gateForm"><h1>欢迎使用小聚</h1><p>像熟���的聊天软件一样，和联系人开启对话。先设置昵称并输入演示房间密码。</p><label for="nickname">昵称</label><input id="nickname" maxlength="24" placeholder="例如：小明" required><label for="roomPassword">房间密码</label><input id="roomPassword" type="password" maxlength="64" placeholder="输入任意演示密码" required><button class="send" type="submit">进入聊天</button><div class="error" id="gateError"></div><p class="warning">这是静态界面演示：没有真正的账号系统、密码验证或实时通信。请勿输入真实密码或私密信息。</p></form></div>
  <script>
    const chats=[
      {id:'transfer',name:'文件传输助手',avatar:'⇧',color:'#dcebd8',preview:'文件和链接可以在这里查看',time:'10:28',messages:[{text:'你好！这是小聚聊天界面演示。',mine:false,time:'10:28'}]},
      {id:'xiaoyu',name:'小雨',avatar:'雨',preview:'周末一起出去玩吗？',time:'昨天',messages:[{text:'嗨，最近怎么样？',mine:false,time:'昨天'},{text:'挺好的！周末一起出去玩吗？',mine:false,time:'昨天'}]},
      {id:'group',name:'周末小分队 (3)',avatar:'群',preview:'阿杰：好的，周六见！',time:'周二',messages:[{text:'大家周六有空吗？',mine:false,time:'周二'},{text:'好的，周六见！',mine:false,time:'周二'}]},
      {id:'ajie',name:'阿杰',avatar:'杰',preview:'收到，回头聊～',time:'周一',messages:[{text:'收到，回头聊～',mine:false,time:'周一'}]}
    ];
    let activeId='transfer', nickname='我';
    const windowEl=document.getElementById('window'), list=document.getElementById('conversationList'), area=document.getElementById('messageArea');
    function renderList(filter=''){
      const contactMode=document.querySelector('.tab.active')?.dataset.tab==='contacts';
      list.innerHTML='';
      chats.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
        const item=document.createElement('div');item.className='conversation'+(c.id===activeId?' selected':'');item.dataset.id=c.id;
        const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=c.avatar;avatar.style.background=c.color||'';
        const text=document.createElement('div');text.className='convtext';const top=document.createElement('div');top.className='convtop';const name=document.createElement('span');name.className='convname';name.textContent=c.name;const time=document.createElement('span');time.className='convtime';time.textContent=contactMode?'':c.time;top.append(name,time);text.append(top);
        if(!contactMode){const preview=document.createElement('div');preview.className='preview';preview.textContent=c.messages.at(-1)?.text||c.preview;text.append(preview)}
        item.append(avatar,text);item.addEventListener('click',()=>selectChat(c.id));list.append(item);
      });
    }
    function renderMessages(){const chat=chats.find(c=>c.id===activeId);document.getElementById('activeName').textContent=chat.name;area.innerHTML='<div class="dayline">今天</div>';chat.messages.forEach(m=>{const row=document.createElement('div');row.className='message'+(m.mine?' mine':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=m.mine?(nickname.slice(0,1)||'我'):chat.avatar;const box=document.createElement('div');box.className='bubblebox';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;const time=document.createElement('div');time.className='msgtime';time.textContent=m.time;box.append(bubble,time);row.append(avatar,box);area.append(row)});area.scrollTop=area.scrollHeight}
    function selectChat(id){activeId=id;renderList(document.getElementById('search').value);renderMessages();windowEl.classList.add('chat-open');document.getElementById('messageText').focus()}
    document.getElementById('gateForm').addEventListener('submit',e=>{e.preventDefault();nickname=document.getElementById('nickname').value.trim()||'我';if(!document.getElementById('roomPassword').value){document.getElementById('gateError').textContent='请输入演示密码';return}document.getElementById('railAvatar').textContent=nickname.slice(0,1);document.getElementById('gate').classList.add('hidden');renderList();renderMessages()});
    document.getElementById('composeForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('messageText');const value=input.value.trim();if(!value)return;const chat=chats.find(c=>c.id===activeId);chat.messages.push({text:value,mine:true,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});input.value='';renderMessages();renderList(document.getElementById('search').value)});
    document.getElementById('messageText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('composeForm').requestSubmit()}});
    document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));
    document.getElementById('back').addEventListener('click',()=>windowEl.classList.remove('chat-open'));
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');renderList(document.getElementById('search').value)}));
    document.getElementById('newChat').addEventListener('click',()=>{const name=prompt('输入联系人的昵称：');if(!name?.trim())return;const id='user-'+Date.now();chats.unshift({id,name:name.trim(),avatar:name.trim().slice(0,1),preview:'',time:'现在',messages:[]});selectChat(id)});
    renderList();renderMessages();
  </script>
</body>
</html>
