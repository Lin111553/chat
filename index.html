<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>小聚 · 聊天空间</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#20243a;background:#f4f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.app{width:min(980px,100%);height:min(720px,calc(100vh - 44px));min-height:520px;background:#fff;border:1px solid #e8eaf2;border-radius:22px;box-shadow:0 18px 60px #25315b12;display:grid;grid-template-columns:280px 1fr;overflow:hidden}.side{background:#fafbfe;border-right:1px solid #eceef5;padding:25px 18px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:20px;margin:2px 6px 26px}.logo{width:37px;height:37px;border-radius:13px;background:linear-gradient(135deg,#8274ff,#a78bfa);display:grid;place-items:center;color:#fff;font-size:21px}.label{font-size:12px;color:#9298aa;margin:0 8px 10px}.room{width:100%;border:0;background:#eeeaff;color:#5748bf;text-align:left;border-radius:12px;padding:12px 13px;font-size:14px;font-weight:650;cursor:pointer}.room span{float:right;color:#8880d2}.side-note{margin:18px 8px;color:#9298aa;font-size:12px;line-height:1.7}.profile{position:absolute;bottom:36px;font-size:13px;color:#60677d}.main{display:flex;flex-direction:column;min-width:0}.top{height:78px;border-bottom:1px solid #eceef5;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.title{font-weight:700}.subtitle{font-size:12px;color:#9298aa;margin-top:5px}.badge{font-size:12px;color:#16865a;background:#e8f8f0;padding:7px 10px;border-radius:20px}.messages{flex:1;overflow:auto;padding:24px 26px;display:flex;flex-direction:column;gap:18px}.welcome{align-self:center;text-align:center;color:#9298aa;font-size:13px;line-height:1.7;margin:30px 0}.msg{max-width:78%;display:flex;gap:10px;align-items:flex-end}.msg.mine{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e9e5ff;color:#6554d4;font-size:13px}.bubble-wrap{min-width:0}.sender{font-size:11px;color:#9298aa;margin:0 0 5px 3px}.bubble{padding:11px 14px;background:#f1f2f7;border-radius:5px 15px 15px 15px;line-height:1.55;overflow-wrap:anywhere;font-size:14px}.mine .bubble{background:#7667ed;color:white;border-radius:15px 5px 15px 15px}.time{font-size:10px;color:#a1a5b2;margin-top:5px}.composer{padding:16px 22px 20px;border-top:1px solid #eceef5}.compose-row{display:flex;gap:10px}.compose-row input{flex:1;min-width:0;border:1px solid #e4e6ef;border-radius:13px;padding:13px 15px;font-size:14px;outline:none}.compose-row input:focus{border-color:#9c91ff}.send,.primary{border:0;border-radius:12px;background:#7667ed;color:white;font-weight:650;padding:0 20px;cursor:pointer}.hint{text-align:center;color:#a2a6b3;font-size:11px;margin-top:10px}.overlay{position:fixed;inset:0;background:#20243a66;display:grid;place-items:center;padding:20px}.dialog{width:min(390px,100%);background:#fff;border-radius:20px;padding:27px;box-shadow:0 22px 70px #171a3033}.dialog h1{font-size:21px;margin:0 0 8px}.dialog p{font-size:13px;color:#777e91;line-height:1.65;margin:0 0 20px}.dialog label{font-size:12px;color:#626a7e;display:block;margin:13px 0 7px}.dialog input{width:100%;border:1px solid #e1e4ee;border-radius:11px;padding:12px;font-size:14px;outline:none}.dialog .primary{width:100%;padding:13px;margin-top:17px}.error{color:#d34b58;font-size:12px;margin-top:9px;min-height:17px}.warning{font-size:11px!important;color:#a17725!important;background:#fff8e6;border-radius:9px;padding:10px;margin-top:14px!important;margin-bottom:0!important}.hidden{display:none!important}.mobile-room{display:none}
    @media(max-width:650px){body{padding:0}.app{height:100vh;min-height:0;border:0;border-radius:0;grid-template-columns:1fr}.side{display:none}.top{height:68px;padding:0 17px}.messages{padding:20px 15px}.composer{padding:13px 12px 16px}.msg{max-width:90%}.mobile-room{display:inline;color:#9298aa;font-size:12px}.badge{font-size:11px;padding:6px 8px}}
  </style>
</head>
<body>
  <div class="app" id="app" aria-label="聊天网页">
    <aside class="side">
      <div class="brand"><div class="logo">✦</div>小聚</div>
      <div class="label">聊天空间</div>
      <button class="room" type="button">💬　我的小房间 <span>●</span></button>
      <div class="side-note">欢迎来到自己的聊天空间。输入昵称和房间密码即可进入演示。</div>
      <div class="profile">◉　访客模式</div>
    </aside>
    <main class="main">
      <header class="top">
        <div><div class="title">我的小房间</div><div class="subtitle"><span class="mobile-room">🔒 密码保护演示　·　</span>和朋友轻松聊天</div></div>
        <div class="badge">●　演示模式</div>
      </header>
      <section class="messages" id="messages" aria-live="polite">
        <div class="welcome">✦<br>欢迎来到小聚<br>通过房间密码后，就可以开始聊天。</div>
      </section>
      <form class="composer" id="chatForm">
        <div class="compose-row"><input id="messageInput" autocomplete="off" placeholder="输入消息…" aria-label="输入消息"><button class="send" type="submit">发送</button></div>
        <div class="hint">这是纯前端演示，消息只保存在当前浏览器中</div>
      </form>
    </main>
  </div>
  <div class="overlay" id="gate">
    <form class="dialog" id="gateForm">
      <h1>进入聊天空间</h1>
      <p>设置一个昵称，并输入你与朋友约定的房间密码。</p>
      <label for="nickname">你的昵称</label><input id="nickname" maxlength="24" placeholder="例如：小明" required>
      <label for="roomPassword">房间密码</label><input id="roomPassword" type="password" maxlength="64" placeholder="输入房间密码" required>
      <button class="primary" type="submit">进入房间</button>
      <div class="error" id="gateError" role="alert"></div>
      <p class="warning">注意：这是静态演示，密码只在此浏览器中临时校验，不是真正的账号或安全保护。不要输入真实密码，也不要用于私密聊天。</p>
    </form>
  </div>
  <script>
    const gate = document.getElementById('gate');
    const gateForm = document.getElementById('gateForm');
    const errorBox = document.getElementById('gateError');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    let nickname = '';
    gateForm.addEventListener('submit', (event) => {
      event.preventDefault();
      nickname = document.getElementById('nickname').value.trim();
      const password = document.getElementById('roomPassword').value;
      if (!nickname || !password) { errorBox.textContent = '请填写昵称和房间密码。'; return; }
      gate.classList.add('hidden');
      messageInput.focus();
    });
    document.getElementById('chatForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || gate.classList.contains('hidden') === false) return;
      const welcome = messages.querySelector('.welcome');
      if (welcome) welcome.remove();
      const row = document.createElement('article');
      row.className = 'msg mine';
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = nickname.slice(0, 1) || '我';
      const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
      const sender = document.createElement('div'); sender.className = 'sender'; sender.textContent = nickname;
      const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
      const time = document.createElement('div'); time.className = 'time'; time.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      wrap.append(sender, bubble, time); row.append(avatar, wrap); messages.appendChild(row);
      messageInput.value = ''; messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
