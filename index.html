<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小聚微信风格聊天</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:#ededed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#222}.app{width:min(1120px,100%);height:min(760px,100vh);margin:auto;display:grid;grid-template-columns:66px 310px 1fr;background:#f5f5f5;box-shadow:0 10px 40px #0002;overflow:hidden}.bar{background:#202a33;color:#aab3ba;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:22px}.avatar{width:42px;height:42px;border-radius:6px;display:grid;place-items:center;background:#c9e6d0;color:#315b40;font-weight:bold}.bar button{border:0;background:transparent;color:#aab3ba;font-size:21px;cursor:pointer}.bar button.active,.bar button:hover{color:#07c160}.bottom{margin-top:auto}.left{background:#f7f7f7;border-right:1px solid #ddd;min-width:0}.head{height:65px;padding:15px;display:flex;gap:9px}.search{width:100%;border:0;border-radius:5px;background:#e9e9e9;padding:9px;outline:0}.plus{border:0;border-radius:5px;font-size:22px;width:36px;color:#555}.tabs{display:flex;gap:26px;height:42px;padding-left:17px;border-bottom:1px solid #e8e8e8;color:#999}.tab{padding-top:12px;cursor:pointer}.tab.active{color:#07b858;border-bottom:2px solid #07c160}.items{height:calc(100% - 107px);overflow:auto}.item{height:70px;padding:11px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}.item:hover,.item.sel{background:#e5e5e5}.item .avatar{width:46px;height:46px;background:#dcebf5}.info{min-width:0;flex:1}.row{display:flex;justify-content:space-between}.name{font-size:14px}.time{font-size:10px;color:#aaa}.preview{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px}.main{display:flex;flex-direction:column;min-width:0}.title{height:61px;padding:20px 24px;border-bottom:1px solid #ddd;font-size:16px}.content{flex:1;overflow:auto;padding:22px}.messages{display:flex;flex-direction:column;gap:18px}.day{text-align:center;color:#aaa;font-size:11px}.msg{display:flex;gap:10px;max-width:78%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}.msg .avatar{width:36px;height:36px}.bubble{background:#fff;padding:10px 12px;border-radius:4px;line-height:1.55;font-size:14px}.mine .bubble{background:#95ec69}.stamp{font-size:10px;color:#aaa;margin-top:4px}.mine .stamp{text-align:right}.compose{height:170px;border-top:1px solid #ddd;padding:12px 22px;display:flex;flex-direction:column}.tools{color:#777;font-size:19px;word-spacing:15px}.compose textarea{flex:1;border:0;resize:none;outline:0;background:transparent;font:14px inherit;padding-top:10px}.send{align-self:flex-end;background:#07c160;border:0;border-radius:4px;color:#fff;padding:8px 26px;cursor:pointer}.news{display:none}.news h2{margin:0 0 15px}.card{background:#fff;border-radius:6px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px #0001}.card h3{margin:0 0 8px;font-size:16px}.card p{margin:0;color:#666;font-size:13px;line-height:1.6}.source{color:#07a954;font-size:11px;margin-bottom:7px}.empty{text-align:center;color:#999;padding:35px}.notice{text-align:center;color:#aaa;font-size:10px;padding:7px}.gate{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.dialog{width:min(380px,100%);background:#fff;padding:26px;border-radius:8px}.dialog h1{margin:0 0 9px;font-size:21px}.dialog p{font-size:13px;color:#777;line-height:1.6}.dialog label{display:block;font-size:12px;margin:12px 0 5px}.dialog input{width:100%;padding:11px;border:1px solid #ddd;border-radius:4px}.dialog .send{width:100%;margin-top:17px}.warning{font-size:11px!important;color:#956c2f!important;background:#fff7e5;padding:9px}.hidden{display:none!important}
@media(max-width:700px){.app{height:100vh;grid-template-columns:1fr}.bar{display:none}.left{grid-column:1;grid-row:1}.main{display:none;grid-column:1;grid-row:1}.app.open .left{display:none}.app.open .main{display:flex}.title{height:55px;padding:17px}.content{padding:15px}.msg{max-width:90%}}
</style></head>
<body>
<div class="app" id="app"><nav class="bar"><div class="avatar" id="me">我</div><button class="active" id="chatNav" title="聊天">▣</button><button id="contactNav" title="通讯录">♙</button><button id="newsNav" title="新闻">☆</button><button class="bottom" title="设置">⚙</button></nav>
<aside class="left"><div class="head"><input class="search" id="search" placeholder="⌕ 搜索好友、聊天或新闻"><button class="plus" id="add">＋</button></div><div class="tabs"><div class="tab active" data-view="chat">聊天</div><div class="tab" data-view="contacts">联系人</div><div class="tab" data-view="news">新闻</div></div><div class="items" id="items"></div><div class="notice">中文系统 · 本地演示</div></aside>
<main class="main"><header class="title" id="title">文件传输助手</header><section class="content"><div class="messages" id="messages"></div><div class="news" id="news"></div></section><form class="compose" id="form"><div class="tools">☻　▧　▤　⌕</div><textarea id="text" placeholder="输入消息，按 Enter 发送"></textarea><button class="send">发送</button></form></main></div>
<div class="gate" id="gate"><form class="dialog" id="gateForm"><h1>欢迎使用小聚</h1><p>请输入昵称后进入中文聊天系统。</p><label>昵称</label><input id="nickname" placeholder="例如：小明" required><label>演示密码</label><input id="password" type="password" placeholder="输入任意密码" required><button class="send">进入系统</button><p class="warning">这是本地网页演示，不是真实微信；请勿输入真实密码。新闻内容为演示摘要。</p></form></div>
<script>
const contacts=[{id:'file',name:'文件传输助手',avatar:'⇧',preview:'文件和链接可以在这里查看',messages:[['你好！这是中文聊天演示。',false]]},{id:'rain',name:'小雨',avatar:'雨',preview:'周末一起出去玩吗？',messages:[['嗨，最近怎么样？',false],['挺好的！周末一起出去玩吗？',false]]},{id:'jie',name:'阿杰',avatar:'杰',preview:'收到，回头聊～',messages:[['收到，回头聊～',false]]}];
const news=[['新华社','国际观察：多国持续加强科技与文化交流合作','最新消息和深度报道摘要将在这里展示。此页面不会跳转到外部网站。'],['AP News','World news：Technology and communities','AP 新闻演示卡片：可在应用内阅读标题与摘要。'],['BBC News','Global update：Stories from around the world','BBC 新闻演示卡片：新闻聚合需要后端接口才能���动实时更新。']];let view='chat',active=contacts[0].id,nick='我';
const $=id=>document.getElementById(id),items=$('items');
function draw(){let q=$('search').value.toLowerCase();items.innerHTML='';if(view==='news'){news.filter(n=>n.join('').toLowerCase().includes(q)).forEach(n=>{let e=document.createElement('div');e.className='item';e.innerHTML='<div class="avatar">新</div><div class="info"><div class="name">'+n[0]+'</div><div class="preview">'+n[1]+'</div></div>';e.onclick=()=>showNews();items.append(e)});return}let arr=contacts.filter(c=>c.name.toLowerCase().includes(q));if(view==='contacts'&&!arr.length)items.innerHTML='<div class="empty">没有找到好友</div>';arr.forEach(c=>{let e=document.createElement('div');e.className='item '+(c.id===active?'sel':'');e.innerHTML='<div class="avatar">'+c.avatar+'</div><div class="info"><div class="row"><span class="name">'+c.name+'</span><span class="time">现在</span></div><div class="preview">'+(view==='contacts'?'点击开始聊天':c.messages.at(-1)?.[0]||c.preview)+'</div></div>';e.onclick=()=>select(c.id);items.append(e)})}
function select(id){active=id;view='chat';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view==='chat'));draw();showChat();$('app').classList.add('open')}
function showChat(){let c=contacts.find(x=>x.id===active);$('title').textContent=c.name;$('news').style.display='none';$('messages').style.display='flex';$('messages').innerHTML='<div class="day">今天</div>';c.messages.forEach(m=>{let e=document.createElement('div');e.className='msg '+(m[1]?'mine':'');e.innerHTML='<div class="avatar">'+(m[1]?nick[0]:c.avatar)+'</div><div><div class="bubble">'+m[0]+'</div><div class="stamp">现在</div></div>';$('messages').append(e)})}
function showNews(){view='news';$('title').textContent='新闻';$('messages').style.display='none';$('news').style.display='block';$('news').innerHTML='<h2>新闻</h2>'+news.map(n=>'<article class="card"><div class="source">'+n[0]+'</div><h3>'+n[1]+'</h3><p>'+n[2]+'</p></article>').join('') ;draw()}
$('gateForm').onsubmit=e=>{e.preventDefault();nick=$('nickname').value.trim()||'我';$('me').textContent=nick[0];$('gate').classList.add('hidden');draw();showChat()};$('form').onsubmit=e=>{e.preventDefault();let t=$('text').value.trim();if(!t||view!=='chat')return;contacts.find(c=>c.id===active).messages.push([t,true]);$('text').value='';showChat();draw()};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('search').oninput=()=>view==='news'?showNews():draw();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));view==='news'?showNews():(draw(),showChat())});$('newsNav').onclick=()=>{view='news';showNews()};$('chatNav').onclick=()=>{view='chat';draw();showChat()};$('contactNav').onclick=()=>{view='contacts';draw()};$('add').onclick=()=>{let n=prompt('请输入好友昵称');if(n?.trim()){let id='u'+Date.now();contacts.unshift({id,name:n.trim(),avatar:n.trim()[0],preview:'新好友',messages:[]});select(id)}};draw();showChat();
</script></body></html>
